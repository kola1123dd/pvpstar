<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvPstar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { text-align: center; padding: 20px; }
        h1 { color: #ffd700; font-size: 32px; margin-bottom: 10px; }
        .balance { font-size: 28px; margin: 20px 0; color: #00ffcc; }
        .btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            max-width: 300px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-green {
            background: linear-gradient(135deg, #00ffcc, #00cc99);
        }
        .result {
            font-size: 48px;
            margin: 20px 0;
            color: #ffd700;
            min-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ PvPstar ⭐</h1>
        <div class="balance">Баланс: <span id="balance">0</span> ⭐</div>
        
        <div class="result" id="result">🎲 </div>
        
        <button class="btn" onclick="rollDice()">🎲  Бросить кости</button>
        <button class="btn btn-green" onclick="buyStars()">⭐ Пополнить на 10</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let balance = 0;

        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }

        function rollDice() {
            const num = Math.floor(Math.random() * 6) + 1;
            document.getElementById('result').textContent = '🎲  ' + num;
        }

        function buyStars() {
            balance += 10;
            updateBalance();
            tg.showAlert("Баланс пополнен на 10 ⭐!");
        }

        updateBalance();
    </script>
</body>
</html>
